[project]
name = "llm-safety-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "biola.dev", email = "biola.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "faker>=40.44.0",
    "google-genai>=1.20.0",
    "jsonschema>=4.26.0",
    "label-studio>=1.23.2",
    "litellm>=1.80.0",
    "ollama>=0.6.3",
    "polars>=2.1.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "tenacity>=9.2.1",
]

[project.scripts]
llm-safety-eval = "llm_safety_eval:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
